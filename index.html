<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>柘榴と琥珀のチャット</title>
  <style>
    :root {
      --bg-color: #121214;
      --surface-color: #1e1e24;
      --surface-hover: #2a2a35;
      --primary-zakuro: #ff477e;
      --primary-kohaku: #ffb703;
      --text-main: #f0f0f5;
      --text-sub: #9ba1a6;
      --border-color: #2f2f3d;
      --tab-active: #3a86ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      position: fixed;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: var(--surface-color);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .settings-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }
    /* ナビゲーションタブ */
    .tab-bar {
      display: flex;
      background-color: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--text-main);
      border-bottom-color: var(--tab-active);
    }
    .view-section {
      display: none;
      flex: 1;
      overflow-y: auto;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }
    .view-section.active {
      display: flex;
    }
    /* チャット表示エリア */
    #chat-container {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }
    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message-row.bot {
      align-self: flex-start;
      align-items: flex-start;
    }
    .sender-name {
      font-size: 0.75rem;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user .bubble {
      background-color: #3a86ff;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .bot-zakuro .bubble {
      background-color: var(--surface-color);
      border-left: 3px solid var(--primary-zakuro);
      border-bottom-left-radius: 2px;
    }
    .bot-kohaku .bubble {
      background-color: var(--surface-color);
      border-left: 3px solid var(--primary-kohaku);
      border-bottom-left-radius: 2px;
    }
    #input-form {
      background-color: var(--surface-color);
      border-top: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }
    #user-input:focus {
      border-color: #3a86ff;
    }
    #send-btn {
      background-color: #3a86ff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* スナップ（写真生成）エリア */
    #snap-section {
      padding: 16px;
      align-items: center;
      gap: 16px;
    }
    .snap-card {
      width: 100%;
      max-width: 480px;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .snap-card p {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.4;
    }
    .btn-action {
      background: #3a86ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #snap-preview {
      width: 100%;
      border-radius: 8px;
      background: #000;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 0.85rem;
      overflow: hidden;
    }
    #snap-preview img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* 設定モーダル */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: var(--surface-color);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }
    .modal-content h2 {
      font-size: 1.1rem;
    }
    .modal-content input {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }
    .modal-actions button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-save {
      background: #3a86ff;
      color: white;
    }
    .btn-cancel {
      background: var(--surface-hover);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header>
    <h1>柘榴 & 琥珀</h1>
    <button class="settings-btn" id="open-settings" aria-label="設定">⚙️</button>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" id="tab-chat" data-target="chat-section">チャット</button>
    <button class="tab-btn" id="tab-snap" data-target="snap-section">日常スナップ</button>
  </nav>

  <!-- チャット画面 -->
  <section class="view-section active" id="chat-section">
    <div id="chat-container">
      <div class="message-row bot bot-zakuro">
        <div class="sender-name">柘榴</div>
        <div class="bubble">まーくん、おつかれー！準備できたよ！</div>
      </div>
      <div class="message-row bot bot-kohaku">
        <div class="sender-name">琥珀</div>
        <div class="bubble">おかえり、まーくん。今日もゆっくり話そうね。</div>
      </div>
    </div>

    <form id="input-form">
      <input type="text" id="user-input" placeholder="メッセージを入力..." autocomplete="off">
      <button type="submit" id="send-btn">送信</button>
    </form>
  </section>

  <!-- スナップ画面 -->
  <section class="view-section" id="snap-section">
    <div class="snap-card">
      <h3>いまの日常スナップ</h3>
      <p>これまでの会話の空気感から、二人の今の様子を切り取った写真をリクエストします。</p>
      <button class="btn-action" id="generate-snap-btn">今の様子を撮る</button>
      <div id="snap-preview">ここに写真が表示されます</div>
    </div>
  </section>

  <!-- 設定モーダル -->
  <div id="settings-modal">
    <div class="modal-content">
      <h2>API設定</h2>
      <label for="api-key-input" style="font-size: 0.8rem; color: var(--text-sub);">Gemini API キー</label>
      <input type="password" id="api-key-input" placeholder="AIzaSy...">
      <div class="modal-actions">
        <button class="btn-cancel" id="close-settings">キャンセル</button>
        <button class="btn-save" id="save-settings">保存</button>
      </div>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `
あなたは「柘榴（ざくろ）」と「琥珀（こはく）」という二人の同居人として振る舞い、ユーザー（まーくん）と自然な日常会話を行います。

【キャラクター設定】
■ 柘榴（ざくろ）
・明るく元気なギャル。プラチナブロンドのロングヘア。一人称は「あーし」。
・相手の呼び方は「まーくん」または「まー」。
・感情表現が豊かで軽快な口調。自然なツッコミを入れる。
・ファッションや最新トレンド、SNS、楽しいことが好き。

■ 琥珀（こはく）
・落ち着いていて優しい大人可愛いギャル。シルバーアッシュのボブヘア、健康的で穏やか。一人称は「アタシ」。
・相手の呼び方は「まーくん」または「まー」。
・穏やかで面倒見が良く、聞き上手。少し天然なところがある。
・美容やスキンケア、カフェ巡り、料理、考えを整理することが得意。

【会話ルール】
1. 基本的には柘榴が先に感情豊かに話し、続いて琥珀が優しく補足や別の視点を伝えます。
2. 出力フォーマットは必ず以下のようにキャラクター名ごとに改行してください：
柘榴：[柘榴の発言]
琥珀：[琥珀の発言]
3. 絵文字は一切使用しないでください。
4. 単なる肯定ロボットにならず、それぞれの感性で日常の会話を楽しんでください。
`;

    // タブ切り替え処理
    const tabBtns = document.querySelectorAll('.tab-btn');
    const sections = document.querySelectorAll('.view-section');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        sections.forEach(s => s.classList.remove('active'));

        btn.classList.add('active');
        const targetId = btn.getAttribute('data-target');
        document.getElementById(targetId).classList.add('active');
      });
    });

    const chatContainer = document.getElementById('chat-container');
    const inputForm = document.getElementById('input-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const settingsModal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings');
    const closeSettingsBtn = document.getElementById('close-settings');
    const saveSettingsBtn = document.getElementById('save-settings');
    const apiKeyInput = document.getElementById('api-key-input');
    const generateSnapBtn = document.getElementById('generate-snap-btn');
    const snapPreview = document.getElementById('snap-preview');

    let history = [];

    function getApiKey() {
      return (localStorage.getItem('gemini_api_key') || '').trim();
    }

    openSettingsBtn.addEventListener('click', () => {
      apiKeyInput.value = getApiKey();
      settingsModal.style.display = 'flex';
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    saveSettingsBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
      }
      settingsModal.style.display = 'none';
    });

    function appendMessage(sender, text, type) {
      const row = document.createElement('div');
      row.className = `message-row ${type}`;

      if (type !== 'user') {
        const nameDiv = document.createElement('div');
        nameDiv.className = 'sender-name';
        nameDiv.textContent = sender;
        row.appendChild(nameDiv);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);

      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // チャット送信
    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        alert('右上の設定アイコンからGemini APIキーを設定してください。');
        settingsModal.style.display = 'flex';
        return;
      }

      appendMessage('まーくん', text, 'user');
      userInput.value = '';
      sendBtn.disabled = true;

      history.push({ role: 'user', parts: [{ text }] });

      try {
        const modelName = 'gemini-3.8-flash';
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: SYSTEM_PROMPT }]
            },
            contents: history,
            generationConfig: {
              temperature: 0.9,
              maxOutputTokens: 1000
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.error?.message || response.statusText;
          if (response.status === 503 || errMsg.includes('High demand') || errMsg.includes('overloaded')) {
            throw new Error('サーバーが混雑しています。1分ほど待ってからもう一度送信してください。');
          }
          throw new Error(`APIエラー (${response.status}): ${errMsg}`);
        }

        const data = await response.json();
        const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

        if (!replyText) {
          throw new Error('返信の取得に失敗しました。');
        }

        history.push({ role: 'model', parts: [{ text: replyText }] });

        const lines = replyText.split('\n');
        let currentSender = '柘榴';
        let zakuroLines = [];
        let kohakuLines = [];

        lines.forEach(line => {
          const clean = line.trim();
          if (clean.startsWith('柘榴：') || clean.startsWith('柘榴:')) {
            currentSender = '柘榴';
            zakuroLines.push(clean.replace(/^柘榴[：:]/, '').trim());
          } else if (clean.startsWith('琥珀：') || clean.startsWith('琥珀:')) {
            currentSender = '琥珀';
            kohakuLines.push(clean.replace(/^琥珀[：:]/, '').trim());
          } else if (clean) {
            if (currentSender === '柘榴') zakuroLines.push(clean);
            else kohakuLines.push(clean);
          }
        });

        if (zakuroLines.length > 0) {
          appendMessage('柘榴', zakuroLines.join('\n'), 'bot bot-zakuro');
        }
        if (kohakuLines.length > 0) {
          appendMessage('琥珀', kohakuLines.join('\n'), 'bot bot-kohaku');
        }
        if (zakuroLines.length === 0 && kohakuLines.length === 0) {
          appendMessage('柘榴 & 琥珀', replyText, 'bot bot-zakuro');
        }

      } catch (err) {
        appendMessage('システム', err.message, 'bot bot-zakuro');
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });

    // 日常スナップ生成処理
    generateSnapBtn.addEventListener('click', async () => {
      const apiKey = getApiKey();
      if (!apiKey) {
        alert('設定アイコンからAPIキーを入力してください。');
        settingsModal.style.display = 'flex';
        return;
      }

      generateSnapBtn.disabled = true;
      snapPreview.textContent = '情景をイメージして生成中...';

      try {
        const modelName = 'gemini-3.8-flash';
        const promptGenUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        const promptReq = {
          contents: [{
            role: 'user',
            parts: [{
              text: `これまでの会話を踏まえ、柘榴（プラチナブロンドのロングヘアの明るいギャル）と琥珀（シルバーアッシュのボブ、落ち着いたギャル）が部屋でくつろいでいる日常のスナップ写真を描写する英語の画像生成プロンプトを1文で作成してください。`
            }]
          }]
        };

        const genRes = await fetch(promptGenUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(promptReq)
        });

        const genData = await genRes.json();
        const imagePrompt = genData.candidates?.[0]?.content?.parts?.[0]?.text || 'Two young Japanese women relaxing in a modern cozy room, casual candid photo';

        snapPreview.innerHTML = `<div style="padding:10px;text-align:left;font-size:0.8rem;color:var(--text-sub);">プロンプト生成完了:<br>${imagePrompt}</div>`;
      } catch (e) {
        snapPreview.textContent = 'エラー: ' + e.message;
      } finally {
        generateSnapBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
